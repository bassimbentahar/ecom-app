<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Payment Confirmation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
        }
        .container {
            width: 80%;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            max-width: 100px;
        }
        .payment-details {
            margin-bottom: 20px;
        }
        .payment-details h2 {
            margin: 0;
        }
        .payment-details p {
            margin: 5px 0;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Payment Confirmation</h1>
    </div>
    <div class="payment-details">
        <h2>Payment Success</h2>
        <p>Dear <span th:text="${customerName}">Customer</span>,</p>
        <p>Your payment has been successfully processed.</p>
        <p><strong>Order Reference:</strong> <span th:text="${orderReference}">OrderReference</span></p>
        <p><strong>Amount Paid:</strong> <span th:text="${amount}">Amount</span></p>
    </div>
    <div class="footer">
        <p>Thank you for your payment!</p>
    </div>
</div>
</body>
</html>
